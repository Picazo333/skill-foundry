name: Skill Foundry Validation

on:
  push:
    branches:
      - main
      - migration/noema-rc0
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/validate_foundry.py
      - run: python -m unittest tests.test_validate_foundry tests.test_vnext_evidence tests.test_validate_factory -v
      - run: python tools/validate_factory.py --portfolio foundry/factory/portfolios/g5-smoke
      - run: python tools/check_protected_evals.py
      - run: python -X utf8 baseline/agentic-skill-suite-v1/scripts/validate_suite.py
